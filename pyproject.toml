[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.11.0",
    "l33t>=0.1.0",
    "slixmpp>=1.12.0",
]

[project.scripts]
puppetbot = "puppetbot:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
]
